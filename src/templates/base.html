<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Household Chores{% endblock %}</title>
  <!-- Bootstrap 5.3 CSS -->
  <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"> -->
  <link href="../static/bootstrap.min.css" rel="stylesheet">
  <link href="../static/touch.css" rel="stylesheet">
  <meta http-equiv="refresh" content="3600000">
  {% block extra_head %}{% endblock %}
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
      <!-- Offcanvas Toggle Button -->
      <button class="btn btn-outline-light" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasSidebar" aria-controls="offcanvasSidebar">
        ☰
      </button>
      <a class="navbar-brand ms-3" href="{{ url_for('dashboard') }}"><h1>Household Chores</h1></a>
    </div>
  </nav>

  <!-- Offcanvas Sidebar -->
  <div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasSidebar" aria-labelledby="offcanvasSidebarLabel">
    <div class="offcanvas-header">
      <h5 class="offcanvas-title" id="offcanvasSidebarLabel">Menu</h5>
      <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body">
      <ul class="nav flex-column">
         <li class="nav-item"><a class="nav-link" href="{{ url_for('dashboard') }}">Dashboard</a></li>
         <li class="nav-item"><a class="nav-link" href="{{ url_for('manage_chores') }}">Manage Chores</a></li>
         <li class="nav-item"><a class="nav-link" href="{{ url_for('manage_users') }}">Manage Users</a></li>
         <li class="nav-item"><a class="nav-link" href="{{ url_for('settings') }}">Settings</a></li>
      </ul>
    </div>
  </div>

  <!-- Main Content -->
  <div class="container-fluid">
    {% block content %}{% endblock %}
  </div>

  <!-- Bootstrap 5.3 JS Bundle (includes Popper) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  {% block extra_js %}{% endblock %}

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      let isDragging = false, startX, startY, scrollLeft, scrollTop;
      
      // Check if the element is interactive, then skip drag-to-scroll
      function isInteractive(el) {
        return el.closest("input, textarea, select, button, a");
      }
      
      document.addEventListener("pointerdown", function(e) {
        if (isInteractive(e.target)) return;
        isDragging = true;
        startX = e.pageX;
        startY = e.pageY;
        scrollLeft = window.scrollX;
        scrollTop = window.scrollY;
        document.body.style.cursor = 'grabbing';
        e.preventDefault();
      });
      
      document.addEventListener("pointerup", function(e) {
        isDragging = false;
        document.body.style.cursor = 'default';
      });
      
      document.addEventListener("pointermove", function(e) {
        if (!isDragging) return;
        e.preventDefault();
        const diffX = e.pageX - startX;
        const diffY = e.pageY - startY;
        window.scrollTo(scrollLeft - diffX, scrollTop - diffY);
      });
    });
    </script>  
    
</body>
</html>
